<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Solar Energy Dashboard for tracking solar generation, grid import and grid export.">
  <title>Solar Energy Dashboard</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/utilities.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="modules/reading/reading.css">
  <link rel="stylesheet" href="modules/history/history.css">
  <link rel="stylesheet" href="modules/dashboard/dashboard.css">
  <link rel="stylesheet" href="modules/analytics/analytics.css">
  <link rel="stylesheet" href="modules/settings/settings.css">
</head>

<body>
  <a class="skip-link" href="#app-content">Skip to content</a>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <button id="mobile-menu-toggle" class="icon-button mobile-only" type="button" aria-label="Open navigation"
          aria-expanded="false" aria-controls="app-sidebar">
          <span class="icon icon-menu" aria-hidden="true"></span>
        </button>
        <span class="brand-mark" aria-hidden="true">☀</span>
        <span class="brand-name">Solar Energy Dashboard</span>
      </div>
      <div class="header-status">
        <span id="header-month" class="header-month"></span>
        <span class="status-indicator" title="Application is running">
          <span class="status-dot" aria-hidden="true"></span>
          Local
        </span>
      </div>
    </header>

    <div class="app-body">
      <aside id="app-sidebar" class="app-sidebar" aria-label="Primary navigation">
        <div class="sidebar-inner">
          <button class="sidebar-close mobile-only" id="mobile-menu-close" type="button"
            aria-label="Close navigation">×</button>
          <nav class="main-nav">
            <a class="nav-item" href="#/dashboard" data-route="dashboard">
              <span class="nav-icon" aria-hidden="true">▦</span><span>Dashboard</span>
            </a>
            <a class="nav-item" href="#/reading" data-route="reading">
              <span class="nav-icon" aria-hidden="true">⊕</span><span>Reading</span>
            </a>
            <a class="nav-item" href="#/history" data-route="history">
              <span class="nav-icon" aria-hidden="true">◷</span><span>History</span>
            </a>
            <a class="nav-item" href="#/analytics" data-route="analytics">
              <span class="nav-icon" aria-hidden="true">▣</span><span>Analytics</span>
            </a>
            <a class="nav-item" href="#/settings" data-route="settings">
              <span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span>
            </a>
          </nav>
        </div>
      </aside>

      <div id="mobile-menu-backdrop" class="mobile-menu-backdrop" hidden></div>

      <main id="app-content" class="app-content" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/sheets-sync.js"></script>
</body>

</html>
